<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Writing Wall - Dark</title>
<style>body{margin:0;background:#0e0f0e;color:#eaeaea;font-family:Georgia,serif}header{padding:22px 24px;border-bottom:1px solid #222;display:flex;justify-content:space-between} .logo{font-size:22px;font-style:italic} input{width:90%;max-width:600px;margin:20px auto;display:block;height:46px;border-radius:8px;border:1px solid #333;background:#181818;color:#fff;padding:0 18px} .grid{max-width:1200px;margin:0 auto;padding:16px 24px 80px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px} @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}} .card{background:#161616;border:1px solid #222;border-radius:0;cursor:pointer} .card img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:grayscale(.2)} .meta{padding:10px 12px;font-family:system-ui;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#888} .modal{position:fixed;inset:0;display:none;background:rgba(0,0,0,.8);z-index:20;align-items:center;justify-content:center;padding:20px} .modal.open{display:flex} .box{background:#1a1a1a;border:1px solid #333;max-width:640px;width:100%} .box img{width:100%} .box .c{padding:20px;font-family:system-ui}</style></head><body>
<header><div class="logo">The Writing Wall — DARK EDITION</div><div style="font-size:11px;color:#666">Design 2</div></header>
<input id="q" placeholder="SEARCH KEYWORDS...">
<div class="grid" id="g"></div>
<div class="modal" id="m"><div class="box"><img id="mi"><div class="c"><h2 id="mt" style="font-family:Georgia"></h2><p id="mp"></p><button onclick="document.getElementById('m').classList.remove('open')">Close</button></div></div></div>
<script>let D=[];async function load(){D=await fetch('./data.json').then(r=>r.json());D.sort((a,b)=>new Date(b.date)-new Date(a.date));render()}function render(){let q=document.getElementById('q').value.toLowerCase();let g=document.getElementById('g');let f=D.filter(d=>!q|| (d.keywords.join(' ')+d.title).toLowerCase().includes(q));g.innerHTML=f.map(d=>`<div class=card data-id="${d.id}"><img src="${d.image}"><div class=meta>${d.keywords.join(' / ')}</div></div>`).join('');g.querySelectorAll('.card').forEach(e=>e.onclick=()=>{let d=D.find(x=>x.id==e.dataset.id);mi.src=d.image;mt.textContent=d.title;mp.textContent=d.post;m.classList.add('open')})}document.getElementById('q').addEventListener('input',render)};m.onclick=e=>{if(e.target.id==='m')m.classList.remove('open')};load()</script></body></html>
