<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Writing Wall - Warm</title>
<style>body{margin:0;background:#fdf6ec;color:#3a2a1a;font-family:system-ui,sans-serif}header{padding:20px 22px;background:#fff8e8;border-bottom:1px solid #f0e0c0;display:flex;justify-content:space-between;align-items:center} .logo{font-weight:800;font-size:20px} input{width:90%;max-width:700px;margin:16px auto;display:block;height:48px;border-radius:14px;border:2px solid #f0d9a0;background:#fff;padding:0 20px} .grid{max-width:1200px;margin:0 auto;padding:16px 22px 80px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px} @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}} .card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 20px rgba(180,140,60,.15);cursor:pointer;transition:.2s} .card:hover{transform:translateY(-3px)} .card img{width:100%;aspect-ratio:1/1;object-fit:cover} .meta{padding:10px 14px;font-size:12px;font-weight:600;color:#8a6a3a} .modal{position:fixed;inset:0;display:none;background:rgba(60,40,10,.4);backdrop-filter:blur(8px);z-index:10;align-items:center;justify-content:center;padding:20px} .modal.open{display:flex} .box{background:#fffdf5;border-radius:24px;max-width:640px;width:100%;overflow:hidden} .box img{width:100%} .box .c{padding:22px}</style></head><body>
<header><div class="logo">☀️ Writing Wall — WARM</div><div style="font-size:11px;background:#f0d9a0;padding:4px 10px;border-radius:999px">Design 3</div></header>
<input id="q" placeholder="Search with warm keywords...">
<div class="grid" id="g"></div>
<div class="modal" id="m"><div class="box"><img id="mi"><div class="c"><h2 id="mt"></h2><p id="mp"></p><button onclick="document.getElementById('m').classList.remove('open')" style="margin-top:10px;border-radius:999px;border:0;background:#f0d9a0;padding:8px 16px">Close</button></div></div></div>
<script>let D=[];async function load(){D=await fetch('./data.json').then(r=>r.json());D.sort((a,b)=>new Date(b.date)-new Date(a.date));render()}function render(){let q=document.getElementById('q').value.toLowerCase();let g=document.getElementById('g');let f=D.filter(d=>!q|| (d.keywords.join(' ')+d.title).toLowerCase().includes(q));g.innerHTML=f.map(d=>`<div class=card data-id="${d.id}"><img src="${d.image}"><div class=meta># ${d.keywords.join(' # ')}</div></div>`).join('');g.querySelectorAll('.card').forEach(e=>e.onclick=()=>{let d=D.find(x=>x.id==e.dataset.id);mi.src=d.image;mt.textContent=d.title;mp.textContent=d.post;m.classList.add('open')})}document.getElementById('q').addEventListener('input',render)};m.onclick=e=>{if(e.target.id==='m')m.classList.remove('open')};load()</script></body></html>
