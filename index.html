<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Writing Wall - Minimal</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#fff;color:#111}header{padding:18px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center} .logo{font-weight:700;font-size:20px;letter-spacing:-.02em} input{width:100%;max-width:1200px;margin:14px auto;display:block;height:44px;border-radius:999px;border:1px solid #e5e5e5;background:#f6f6f6;padding:0 20px} .grid{max-width:1200px;margin:0 auto;padding:14px 20px 60px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px} @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}} .card{border:1px solid #eee;border-radius:12px;overflow:hidden;cursor:pointer} .card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block} .meta{padding:8px 10px;font-size:11px;color:#777} .modal{position:fixed;inset:0;display:none;background:rgba(0,0,0,.5);z-index:10;align-items:center;justify-content:center;padding:20px} .modal.open{display:flex} .box{background:#fff;max-width:640px;width:100%;border-radius:16px;overflow:hidden} .box img{width:100%;max-height:50vh;object-fit:cover} .box .c{padding:18px}</style></head><body>
<header><div class="logo">WRITING WALL • MINIMAL</div><div style="font-size:12px;color:#999">Design 1</div></header>
<input id="q" placeholder="Search keywords...">
<div class="grid" id="g"></div>
<div class="modal" id="m"><div class="box"><img id="mi"><div class="c"><h2 id="mt"></h2><p id="mp"></p><button onclick="document.getElementById('m').classList.remove('open')" style="margin-top:12px">Close</button></div></div></div>
<script>let D=[];async function load(){D=await fetch('./data.json').then(r=>r.json());D.sort((a,b)=>new Date(b.date)-new Date(a.date));render()}function render(){let q=document.getElementById('q').value.toLowerCase();let g=document.getElementById('g');let f=D.filter(d=>!q|| (d.keywords.join(' ')+d.title).toLowerCase().includes(q));g.innerHTML=f.map(d=>`<div class=card data-id="${d.id}"><img src="${d.image}"><div class=meta>${d.keywords.join(' • ')}</div></div>`).join('');g.querySelectorAll('.card').forEach(e=>e.onclick=()=>{let d=D.find(x=>x.id==e.dataset.id);mi.src=d.image;mt.textContent=d.title;mp.textContent=d.post;m.classList.add('open')})}document.getElementById('q').addEventListener('input',render)};m.onclick=e=>{if(e.target.id==='m')m.classList.remove('open')};load()</script></body></html>
