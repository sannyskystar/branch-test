<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Writing Wall - Color</title>
<style>body{margin:0;background:#f5f5ff;color:#111;font-family:system-ui,sans-serif}header{padding:18px 22px;background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#1dd1a1);display:flex;justify-content:space-between;align-items:center;color:#000} .logo{font-weight:900;font-size:22px;letter-spacing:-.02em} input{width:90%;max-width:700px;margin:18px auto;display:block;height:50px;border-radius:12px;border:3px solid #000;background:#fff;padding:0 20px;font-weight:600} .grid{max-width:1200px;margin:0 auto;padding:16px 22px 80px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px} @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}} .card{border:3px solid #000;border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;transform:rotate(-.5deg)} .card:nth-child(even){transform:rotate(.5deg)} .card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-bottom:3px solid #000} .meta{padding:8px 10px;font-size:11px;font-weight:800;text-transform:uppercase} .modal{position:fixed;inset:0;display:none;background:rgba(0,0,0,.6);z-index:20;align-items:center;justify-content:center;padding:20px} .modal.open{display:flex} .box{background:#fff;border:3px solid #000;border-radius:16px;max-width:640px;width:100%;overflow:hidden} .box img{width:100%;border-bottom:3px solid #000} .box .c{padding:20px}</style></head><body>
<header><div class="logo">WRITING WALL — POP EDITION</div><div style="background:#000;color:#fff;padding:4px 10px;font-size:11px;font-weight:800">DESIGN 4</div></header>
<input id="q" placeholder="TYPE KEYWORD TO FILTER...">
<div class="grid" id="g"></div>
<div class="modal" id="m"><div class="box"><img id="mi"><div class="c"><h2 id="mt"></h2><p id="mp"></p><button onclick="document.getElementById('m').classList.remove('open')" style="border:3px solid #000;background:#feca57;font-weight:800;padding:8px 14px;border-radius:8px;margin-top:10px">CLOSE</button></div></div></div>
<script>let D=[];async function load(){D=await fetch('./data.json').then(r=>r.json());D.sort((a,b)=>new Date(b.date)-new Date(a.date));render()}function render(){let q=document.getElementById('q').value.toLowerCase();let g=document.getElementById('g');let f=D.filter(d=>!q|| (d.keywords.join(' ')+d.title).toLowerCase().includes(q));g.innerHTML=f.map(d=>`<div class=card data-id="${d.id}"><img src="${d.image}"><div class=meta>${d.keywords.join(' ★ ')}</div></div>`).join('');g.querySelectorAll('.card').forEach(e=>e.onclick=()=>{let d=D.find(x=>x.id==e.dataset.id);mi.src=d.image;mt.textContent=d.title;mp.textContent=d.post;m.classList.add('open')})}document.getElementById('q').addEventListener('input',render)};m.onclick=e=>{if(e.target.id==='m')m.classList.remove('open')};load()</script></body></html>
